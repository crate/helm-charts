app: crate

crate:
  clusterName: crate
  heapSize: 1.0  # GiB
  numberOfNodes: 1
  recoverAfterNodes: null
  # JMX and monitoring configuration
  jmx:
    enabled: true
    port: 6666
    exporter:
      enabled: true
      port: 7071
      version: "1.2.0"
  # Stats collection for monitoring
  stats:
    enabled: true

http:
  cors:
    allowOrigin: "*"
    enabled: false

image:
  tag: 5.10.10

# Additional Java options for production
javaOpts:
  # JMX configuration
  jmx: "-Dcom.sun.management.jmxremote.port=6666 -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.rmi.port=6666 -Djava.rmi.server.hostname=127.0.0.1"
  # JMX exporter agent
  jmxExporter: "-javaagent:/var/lib/crate/crate-jmx-exporter-{{.Values.crate.jmx.exporter.version}}.jar={{.Values.crate.jmx.exporter.port}}"
  # Memory dump configuration
  heapDump: "-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump"
  # Security
  security: "-Dlog4j2.formatMsgNoLookups=true"

persistentVolume:
  annotations: {}
  accessModes:
    - ReadWriteOnce
  enabled: true
  size: 10Gi
  storageClass: local-path

resources:
  limits:
    cpu: 1
    memory: null
  requests:
    cpu: 500m

service:
  name: crate
  ports:
    psql: 5432
    ui: 4200
    transport: 4300
    jmx: 6666
    prometheus: 7071

# Monitoring configuration
monitoring:
  enabled: true
  # Prometheus scraping via annotations
  annotations:
    enabled: true
    interval: 30s
    path: /metrics
    port: 7071  # Use JMX exporter port instead of CrateDB HTTP

# Prometheus configuration
prometheus:
  enabled: true
  alertmanager:
    enabled: false
  grafana:
    enabled: false
  kube-state-metrics:
    enabled: true
  node-exporter:
    enabled: true
  prometheus-node-exporter:
    enabled: true
  prometheus-pushgateway:
    enabled: false
  prometheusOperator:
    admissionWebhooks:
      enabled: false
  prometheus:
    prometheusSpec:
      retention: 7d
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi
      # Enable annotation-based service discovery
      additionalScrapeConfigs:
        - job_name: 'kubernetes-pods'
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: true
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $1:$2
              target_label: __address__
            - action: labelmap
              regex: __meta_kubernetes_pod_label_(.+)
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: kubernetes_namespace
            - source_labels: [__meta_kubernetes_pod_name]
              action: replace
              target_label: kubernetes_pod_name
        - job_name: 'kubernetes-services'
          kubernetes_sd_configs:
            - role: service
          relabel_configs:
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
              action: keep
              regex: true
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
              action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $1:$2
              target_label: __address__
            - action: labelmap
              regex: __meta_kubernetes_service_label_(.+)
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: kubernetes_namespace
            - source_labels: [__meta_kubernetes_service_name]
              action: replace
              target_label: kubernetes_service_name

# Grafana configuration
grafana:
  enabled: true
  adminPassword: admin
  persistence:
    enabled: true
    size: 5Gi
  initChownData:
    enabled: false
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://{{ .Release.Name }}-prometheus-server
          access: proxy
          isDefault: true
        - name: CrateDB
          type: postgres
          url: crate:5432
          user: crate
          jsonData:
            database: doc
            sslmode: disable
            connMaxLifetime: 14400
            postgresVersion: 1000
  dashboards:
    default:
      crate-db:
        gnetId: 15983
        revision: 1
        datasource: Prometheus
